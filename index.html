<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snektris · 贪吃蛇 × 俄罗斯方块</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#0b0f1a; color:#e6edf7;
    font-family:-apple-system,"PingFang SC","Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; overflow:hidden; }
  h1 { font-size:20px; margin:10px 0 2px; letter-spacing:2px; }
  h1 .s { color:#5ee08c; } h1 .t { color:#6cb8ff; }
  #hud { display:flex; gap:14px; font-size:13px; margin:4px 0 8px; opacity:.9; }
  #hud b { color:#ffd76c; font-variant-numeric:tabular-nums; }
  #wrap { position:relative; }
  canvas { background:#11182b; border-radius:10px; display:block;
    box-shadow:0 0 0 2px #223050, 0 12px 40px rgba(0,0,0,.5);
    width:min(92vw, 46vh); height:auto; touch-action:none; }
  #overlay { position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; background:rgba(5,8,16,.82);
    border-radius:10px; text-align:center; padding:20px; }
  #overlay h2 { font-size:24px; margin-bottom:8px; }
  #overlay p { font-size:14px; line-height:1.7; opacity:.85; }
  #overlay button { margin-top:16px; font-size:16px; padding:10px 34px;
    border:none; border-radius:8px; background:#5ee08c; color:#06210f;
    font-weight:700; cursor:pointer; }
  #pad { display:flex; gap:10px; margin-top:12px; }
  #pad button { width:58px; height:48px; font-size:20px; border:none;
    border-radius:10px; background:#223050; color:#cfe0ff; cursor:pointer;
    user-select:none; }
  #pad button:active { background:#35507f; }
  #tip { font-size:12px; opacity:.55; margin-top:8px; text-align:center; line-height:1.6; padding:0 12px; }
</style>
</head>
<body>
<h1><span class="s">SNEK</span><span class="t">TRIS</span> 贪吃蛇 × 俄罗斯方块</h1>
<div id="hud">
  <span>分数 <b id="score">0</b></span>
  <span>消行 <b id="lines">0</b></span>
  <span>等级 <b id="level">1</b></span>
  <span>蛇长 <b id="slen">3</b></span>
</div>
<div id="wrap">
  <canvas id="game" width="300" height="600"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">游戏结束</h2>
    <p id="ovText"></p>
    <button id="restart">再来一局</button>
  </div>
</div>
<div id="pad">
  <button data-k="left">◀</button>
  <button data-k="right">▶</button>
  <button data-k="rotate">↻</button>
  <button data-k="drop">⤓</button>
</div>
<div id="tip">
  键盘：方向键控制方块 · WASD 控制蛇<br>
  手机：下方按钮控制方块 · 在棋盘上滑动唤醒并改变蛇的方向<br>
  蛇休眠时半透明，滑动 / WASD 唤醒；吃 🍎 变长得分；撞进方块会把它啃掉（长度-1），可以救场也会变小；小心别让下落的方块压到蛇
</div>

<script>
"use strict";
// ---------- 常量 ----------
const COLS = 10, ROWS = 20, CELL = 30;
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");

const SHAPES = {
  I: [[0,0],[1,0],[2,0],[3,0]],
  O: [[0,0],[1,0],[0,1],[1,1]],
  T: [[0,0],[1,0],[2,0],[1,1]],
  S: [[1,0],[2,0],[0,1],[1,1]],
  Z: [[0,0],[1,0],[1,1],[2,1]],
  J: [[0,0],[0,1],[1,1],[2,1]],
  L: [[2,0],[0,1],[1,1],[2,1]],
};
const COLORS = { I:"#43d6e8", O:"#f5d042", T:"#b96fe8", S:"#54de6f",
                 Z:"#ef5350", J:"#5b8def", L:"#f5a142" };
const KEYS = Object.keys(SHAPES);

// 棋盘单元: 0 空 | 颜色字符串=方块 | "F"=食物
let board, piece, snake, dir, dirQueue, score, lines, level, slen;
let dropAcc, lastTime, snakeAcc, gameOver, invincible, snakeActive;

function reset() {
  board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  score = 0; lines = 0; level = 1;
  snake = [{x:4,y:19},{x:3,y:19},{x:2,y:19}];
  dir = {x:1,y:0}; dirQueue = [];
  gameOver = false; invincible = 0; snakeActive = false;
  dropAcc = 0; snakeAcc = 0; lastTime = performance.now();
  spawnPiece(); spawnFood();
  document.getElementById("overlay").style.display = "none";
  updateHud();
}

function updateHud() {
  document.getElementById("score").textContent = score;
  document.getElementById("lines").textContent = lines;
  document.getElementById("level").textContent = level;
  document.getElementById("slen").textContent = snake.length;
}

// ---------- 俄罗斯方块 ----------
function spawnPiece() {
  const k = KEYS[Math.floor(Math.random()*KEYS.length)];
  const cells = SHAPES[k].map(([x,y]) => ({x, y}));
  piece = { key:k, cells, x:3, y:0, foodCell:-1 };
  // 20% 概率方块里藏着一颗苹果，落定后变成棋盘上的食物
  if (Math.random() < 0.2) piece.foodCell = Math.floor(Math.random()*cells.length);
  if (collides(piece.cells, piece.x, piece.y)) endGame();
}

function collides(cells, px, py) {
  return cells.some(c => {
    const x = px + c.x, y = py + c.y;
    return x < 0 || x >= COLS || y >= ROWS || (y >= 0 && board[y][x] !== 0);
  });
}

function movePiece(dx) {
  if (!gameOver && !collides(piece.cells, piece.x+dx, piece.y)) piece.x += dx;
}

function rotatePiece() {
  if (gameOver || piece.key === "O") return;
  const rot = piece.cells.map(c => ({x: -c.y, y: c.x}));
  for (const kick of [0,-1,1,-2,2]) {
    if (!collides(rot, piece.x+kick, piece.y)) {
      piece.cells = rot; piece.x += kick; return;
    }
  }
}

function softDrop(auto) {
  if (gameOver) return;
  if (!collides(piece.cells, piece.x, piece.y+1)) {
    piece.y++;
    if (!auto) { score += 1; updateHud(); }
  }
  else lockPiece();
}

function hardDrop() {
  if (gameOver) return;
  while (!collides(piece.cells, piece.x, piece.y+1)) { piece.y++; score += 2; }
  lockPiece(); updateHud();
}

function lockPiece() {
  piece.cells.forEach((c, i) => {
    const x = piece.x + c.x, y = piece.y + c.y;
    if (y >= 0) board[y][x] = (i === piece.foodCell) ? "F" : piece.key;
  });
  // 方块落定压到蛇：压掉的节被移除，压到头或压得太短则蛇死亡重生
  const pieceCells = new Set(piece.cells.map(c => (piece.x+c.x) + "," + (piece.y+c.y)));
  const headCrushed = pieceCells.has(snake[0].x + "," + snake[0].y);
  const before = snake.length;
  snake = snake.filter(s => !pieceCells.has(s.x + "," + s.y));
  if (snake.length < before) score = Math.max(0, score - 20 * (before - snake.length));
  if (headCrushed || snake.length < 2) killSnake();
  clearLines();
  spawnPiece();
}

function clearLines() {
  let n = 0;
  for (let y = ROWS-1; y >= 0; y--) {
    if (board[y].every(v => v !== 0 && v !== "F")) {
      board.splice(y, 1);
      board.unshift(Array(COLS).fill(0));
      n++; y++;
    }
  }
  if (n) {
    lines += n;
    score += [0,100,300,500,800][n] * level;
    level = Math.floor(lines / 10) + 1;
  }
}

// ---------- 贪吃蛇 ----------
function spawnFood() {
  const empty = [];
  for (let y=0; y<ROWS; y++) for (let x=0; x<COLS; x++)
    if (board[y][x] === 0 && !snake.some(s => s.x===x && s.y===y)) empty.push({x,y});
  if (!empty.length) return;
  const f = empty[Math.floor(Math.random()*empty.length)];
  board[f.y][f.x] = "F";
}

function setDir(x, y) {
  snakeActive = true; // 首次转向唤醒蛇
  const last = dirQueue.length ? dirQueue[dirQueue.length-1] : dir;
  if (last.x === -x && last.y === -y) return; // 禁止掉头
  if (last.x === x && last.y === y) return;
  if (dirQueue.length < 3) dirQueue.push({x, y});
}

function stepSnake() {
  if (!snakeActive) return; // 蛇休眠中，等待第一次转向
  if (dirQueue.length) dir = dirQueue.shift();
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (invincible > 0) invincible--;

  const hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
  const hitSelf = snake.some((s, i) => i > 0 && s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) {
    if (invincible > 0) return; // 重生保护期：站住不动
    killSnake(); return;
  }

  const cell = board[head.y][head.x];
  if (cell === "F") {
    board[head.y][head.x] = 0;
    snake.unshift(head);
    snake.unshift({...head}); // 长 2 节
    score += 50;
    spawnFood();
  } else if (cell !== 0) {
    // 啃掉方块：保护期免费啃；否则长度 >3 消耗 1 节自救，长度不够则死亡
    board[head.y][head.x] = 0;
    score += 10;
    if (invincible > 0) { snake.unshift(head); snake.pop(); }
    else if (snake.length > 3) { snake.pop(); snake.unshift(head); }
    else { killSnake(); return; }
  } else {
    snake.unshift(head);
    snake.pop();
  }
  updateHud();
}

function killSnake() {
  score = Math.max(0, score - 100);
  // 重生避开当前下落方块所在的危险行
  const danger = new Set();
  for (let y = piece.y - 1; y <= piece.y + 4; y++) danger.add(y);
  for (let y = ROWS-1; y >= 0; y--) {
    if (danger.has(y)) continue;
    for (let x = 2; x < COLS-2; x++) {
      if (board[y][x]===0 && board[y][x-1]===0 && board[y][x-2]===0) {
        snake = [{x,y},{x:x-1,y},{x:x-2,y}];
        dir = {x:1,y:0}; dirQueue = []; invincible = 20; snakeActive = false;
        updateHud(); return;
      }
    }
  }
  // 兜底：任意空位
  for (let y = ROWS-1; y >= 0; y--) {
    if (danger.has(y)) continue;
    for (let x = 1; x < COLS-1; x++) {
      if (board[y][x]===0) {
        snake = [{x,y}];
        dir = {x:1,y:0}; dirQueue = []; invincible = 20; snakeActive = false;
        updateHud(); return;
      }
    }
  }
  snake = [{x:1,y:ROWS-1}]; dir = {x:1,y:0}; dirQueue = []; invincible = 20; snakeActive = false;
  updateHud();
}

function endGame() {
  gameOver = true;
  document.getElementById("ovTitle").textContent = "游戏结束";
  document.getElementById("ovText").textContent =
    `最终分数 ${score} · 消行 ${lines} · 等级 ${level}`;
  document.getElementById("overlay").style.display = "flex";
}

// ---------- 渲染 ----------
function drawCell(x, y, color, alpha) {
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = color;
  ctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
  ctx.fillStyle = "rgba(255,255,255,.18)";
  ctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, 5);
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  // 网格
  ctx.strokeStyle = "rgba(255,255,255,.045)";
  for (let x=1; x<COLS; x++) { ctx.beginPath(); ctx.moveTo(x*CELL,0); ctx.lineTo(x*CELL,cv.height); ctx.stroke(); }
  for (let y=1; y<ROWS; y++) { ctx.beginPath(); ctx.moveTo(0,y*CELL); ctx.lineTo(cv.width,y*CELL); ctx.stroke(); }

  // 已落定方块 & 食物
  for (let y=0; y<ROWS; y++) for (let x=0; x<COLS; x++) {
    const v = board[y][x];
    if (v === "F") {
      ctx.fillStyle = "#ff5a76";
      ctx.beginPath();
      ctx.arc(x*CELL+CELL/2, y*CELL+CELL/2, CELL/3, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#5ee08c";
      ctx.fillRect(x*CELL+CELL/2-1, y*CELL+3, 3, 6);
    } else if (v) drawCell(x, y, COLORS[v]);
  }

  // 幽灵投影
  let gy = piece.y;
  while (!collides(piece.cells, piece.x, gy+1)) gy++;
  piece.cells.forEach(c => drawCell(piece.x+c.x, gy+c.y, "rgba(255,255,255,.14)"));

  // 下落方块（藏苹果的格子画红边）
  piece.cells.forEach((c, i) => {
    drawCell(piece.x+c.x, piece.y+c.y, COLORS[piece.key]);
    if (i === piece.foodCell) {
      ctx.strokeStyle = "#ff5a76"; ctx.lineWidth = 3;
      ctx.strokeRect((piece.x+c.x)*CELL+2, (piece.y+c.y)*CELL+2, CELL-4, CELL-4);
      ctx.lineWidth = 1;
    }
  });

  // 蛇（休眠半透明，重生无敌期闪烁）
  const blink = invincible > 0 && Math.floor(performance.now()/120) % 2 === 0;
  const snakeAlpha = snakeActive ? 1 : 0.45;
  if (!blink) snake.forEach((s, i) => {
    if (i === 0) {
      drawCell(s.x, s.y, "#5ee08c", snakeAlpha);
      ctx.globalAlpha = snakeAlpha;
      ctx.fillStyle = "#06210f";
      ctx.fillRect(s.x*CELL+7, s.y*CELL+7, 4, 4);
      ctx.fillRect(s.x*CELL+CELL-11, s.y*CELL+7, 4, 4);
      ctx.globalAlpha = 1;
    } else {
      const g = 200 - Math.min(120, i*8);
      drawCell(s.x, s.y, `rgb(60,${g},110)`, snakeAlpha);
    }
  });
}

// ---------- 主循环 ----------
function loop(now) {
  const dt = Math.min(100, now - lastTime);
  lastTime = now;
  if (!gameOver) {
    dropAcc += dt;
    const interval = Math.max(80, 700 - (level-1)*60);
    while (dropAcc >= interval) { dropAcc -= interval; softDrop(true); }
    snakeAcc += dt;
    while (snakeAcc >= 150) { snakeAcc -= 150; stepSnake(); }
  }
  draw();
  requestAnimationFrame(loop);
}

// ---------- 输入 ----------
const keyMap = { ArrowLeft:"left", ArrowRight:"right", ArrowUp:"rotate",
                 ArrowDown:"drop", " ":"hard" };
document.addEventListener("keydown", e => {
  const k = keyMap[e.key];
  if (k) { e.preventDefault(); doAction(k); }
  const d = { w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] }[e.key.toLowerCase()];
  if (d) setDir(d[0], d[1]);
});

function doAction(k) {
  if (gameOver) return;
  if (k === "left") movePiece(-1);
  else if (k === "right") movePiece(1);
  else if (k === "rotate") rotatePiece();
  else if (k === "drop") softDrop();
  else if (k === "hard") hardDrop();
}

document.querySelectorAll("#pad button").forEach(btn => {
  btn.addEventListener("click", () => doAction(btn.dataset.k));
});

// 触屏滑动控制蛇
let touchStart = null;
cv.addEventListener("touchstart", e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
cv.addEventListener("touchmove", e => {
  if (!touchStart) return;
  const dx = e.touches[0].clientX - touchStart.x;
  const dy = e.touches[0].clientY - touchStart.y;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(Math.sign(dx), 0);
  else setDir(0, Math.sign(dy));
  touchStart = null;
  e.preventDefault();
}, { passive: false });

document.getElementById("restart").addEventListener("click", reset);

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
